<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Walid Mostafa — full-stack developer</title>
  <desc id="d">Ships systems, not demos. C#, .NET, TypeScript, Python. Egypt, remote.</desc>

  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="#0A0705"/>
  <rect width="1200" height="360" filter="url(#grain)" opacity="0.035"/>

  <!-- eyebrow -->
  <rect x="72" y="84" width="6" height="6" fill="#FF5A1F"/>
  <text x="90" y="93" fill="#8B7D71" font-family="ui-monospace,'IBM Plex Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="11.5" letter-spacing="3.2">PORTFOLIO — 2026</text>

  <!-- name -->
  <text x="70" y="196" fill="#F4ECE2" font-family="Georgia,'Times New Roman',serif" font-size="82" letter-spacing="-1">Walid</text>
  <text x="70" y="282" fill="#F4ECE2" font-family="Georgia,'Times New Roman',serif" font-size="82" font-style="italic" letter-spacing="-1">Mostafa</text>

  <!-- tagline -->
  <text x="1128" y="202" text-anchor="end" fill="#F4ECE2" font-family="Georgia,'Times New Roman',serif" font-size="25">Full-stack developer.</text>
  <text x="1128" y="240" text-anchor="end" fill="#AB9D8F" font-family="Georgia,'Times New Roman',serif" font-size="25">Ships <tspan fill="#FF5A1F" font-style="italic">systems</tspan>, not demos.</text>

  <!-- rule -->
  <line x1="72" y1="312" x2="1128" y2="312" stroke="#2A221B" stroke-width="1"/>

  <!-- meta -->
  <text x="72" y="341" fill="#AB9D8F" font-family="ui-monospace,'IBM Plex Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="11.5" letter-spacing="1.4">C# · .NET · TYPESCRIPT · PYTHON</text>
  <text x="1128" y="341" text-anchor="end" fill="#AB9D8F" font-family="ui-monospace,'IBM Plex Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="11.5" letter-spacing="1.4">EGYPT · REMOTE</text>
</svg>
